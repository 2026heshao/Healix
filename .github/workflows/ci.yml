#!/usr/bin/env bash
# Healix —— 持续集成。
#
# 触发：push 到 main、向 main 提 PR。
# 目标：证明"代码能编译 + 单元测试能过"，并留下 debug APK 供真机试装。
#
# ⚠️ 本 workflow **不注入任何 API key**。
#    API key 只在 App 里由用户手动输入 → EncryptedSharedPreferences（C6）。
#    构建期不需要、也不允许接触 key。
#
# 需要的 GitHub Secrets：无。
# （release 才需要 keystore 相关 secrets，见 release.yml）

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的旧构建自动取消，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 + 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（Temurin）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK 由 runner 预装（ubuntu-latest 自带 ANDROID_HOME）。
      #
      # ⚠️ 必须显式列出 packages。不写 packages 时，setup-android@v3 会尝试安装
      #    已被新版 SDK 仓库移除的旧 `tools` 包，导致 sdkmanager 报
      #    "Failed to find package 'tools'" 并退出 1（实测 CI 首跑即挂在此步）。
      #    只装我们真正需要的：platform 35（compileSdk）+ build-tools 35。
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'
          accept-android-sdk-licenses: true

      # Gradle 缓存：key 跟 build.gradle 的 hash 走，依赖不变则命中
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # gradlew 需要可执行位。Windows 下提交的文件在 Linux runner 上会丢失该位。
      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      # 资源静态检查：秒级发现「重复定义 / 悬空引用」，比等 Gradle 跑到
      # mergeDebugResources 才报错快得多（实测首跑就栽在 strings.xml 的
      # type_meal 重复定义上，而这本可以在 1 秒内查出来）。
      - name: 资源静态检查
        run: python3 pipeline/check_resources.py

      # 夜间资源对等检查：values-night/ 下的 colors.xml / themes.xml 是**整份重定义**
      # （同名资源不跨限定符合并）→ 白天有、夜间漏的颜色键/样式 item 只在夜间模式
      # **静默错**（本仓库踩过"夜间弹层白底 bug 复现"）。纯静态、零依赖，
      # 与资源检查同一批、放在编译之前。
      - name: 夜间资源对等检查
        run: python3 pipeline/check_night_parity.py

      # Kotlin/Room 静态检查：本机不装 JDK，编译错误本地复现不了；
      # 这一步把「编译器最常抓到的那几类问题」提前到秒级暴露
      # （重复 @TypeConverter、SUM() 映射成 Int、悬空 binding.xxx、
      #   Manifest 指向不存在的类/资源）。
      - name: Kotlin/Room 静态检查
        run: python3 pipeline/check_kotlin.py

      # 跨包 import 漏抄检查：check_kotlin.py 是正则型、不做符号解析，对
      # 「代码从 A 文件迁到 B 文件、import 段没跟着走」零覆盖 —— 本地三条检查器
      # 全绿、CI 编译才炸（run #71 实证：RecordListAdapters.kt 的
      # `Unresolved reference 'EventText'`，3 处）。本步用「全仓顶层声明表 +
      # 文件 import 表」双向比对，把这类错误提前到编译前的秒级暴露。
      - name: 跨包 import 漏抄检查
        run: python3 pipeline/check_imports.py

      # Python 侧合约自测：67 项断言，纯离线，不依赖网络/API key
      - name: Python 合约自测
        run: python3 pipeline/tests/test_norm.py

      - name: 编译 debug + 跑单元测试
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      # always()：即使测试失败也要拿到 APK，便于定位问题
      - name: 上传 debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # 单元测试报告（失败时最有价值）
      - name: 上传单元测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healix-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      # Room 导出的 schema JSON（exportSchema=true 时生成）。
      # 迁移历史必须可追溯 → 需要提交入库，但本机无 JDK 跑不出，
      # 故由 CI 产出后人工拉回本地提交（见 pipeline/pull_schemas.py）。
      - name: 上传 Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healix-room-schema
          path: app/schemas/**
          if-no-files-found: warn
          retention-days: 30

      # Room schema 完整性：@Database(version=N) 必须有已入库的 N.json、
      # 新增表/索引的 DDL 必须逐字出现在对应 Migration 块里、禁
      # fallbackToDestructiveMigration（见 pipeline/check_schema.py 的注释）。
      #
      # ⚠️ **必须放在编译与产物上传之后**，与上面两个静态检查相反 ——
      #    N.json 由 Room 在 KSP 编译期生成，本机没有 JDK 造不出来，唯一来源
      #    就是上一步的 artifact。若把本检查提前到编译之前，就会死锁：
      #    升 version → 检查报"缺 N.json" → 编译被跳过 → artifact 里没有 N.json
      #    → 永远拉不回来。放在这里，编译照跑、artifact 照传，
      #    检查红着，开发者用 pipeline/pull_schemas.py 拉回提交即转绿。
      - name: Room schema 完整性检查
        if: always()
        run: python3 pipeline/check_schema.py
